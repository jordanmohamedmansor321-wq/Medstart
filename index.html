<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MedStart</title>

  <meta
    name="description"
    content="MedStart - منصة تعليمية لطلاب سنة إعداد الطب"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #2563eb;
    }

    .auth-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #eef2ff;
      color: #2563eb;
    }

    .danger {
      background: #dc2626;
      color: #fff;
    }

    .user-box {
      display: none;
      align-items: center;
      gap: 10px;
      color: #475569;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 22px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(37, 99, 235, .15);
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 38px;
    }

    .hero p {
      margin: 0;
      line-height: 1.9;
      opacity: .95;
    }

    .section {
      margin-top: 35px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-title h2 {
      margin: 0;
    }

    #subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .subject-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.04);
    }

    .subject-card h3 {
      margin: 0 0 10px;
    }

    .subject-card p {
      color: #64748b;
      line-height: 1.7;
    }

    .empty {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      color: #64748b;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #64748b;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-box input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .modal-box input:focus {
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 12px;
    }

    .modal-actions button {
      flex: 1;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
      }

      .hero h1 {
        font-size: 29px;
      }

      .hero {
        padding: 35px 20px;
      }

      .user-box {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      MedStart 🩺
    </div>

    <div class="auth-area">

      <div id="guestButtons">
        <button
          class="secondary"
          id="loginBtn">
          تسجيل الدخول
        </button>

        <button
          class="primary"
          id="registerBtn">
          إنشاء حساب
        </button>
      </div>

      <div
        class="user-box"
        id="userBox">

        <span id="userEmail"></span>

        <button
          class="danger"
          id="logoutBtn">
          تسجيل الخروج
        </button>

      </div>

    </div>

  </div>
</header>


<main>

  <section class="hero">

    <h1>
      مرحبًا بك في MedStart 🩺
    </h1>

    <p>
      منصتك التعليمية لطلاب سنة إعداد الطب.
      <br>
      المواد والوحدات والدروس في مكان واحد.
    </p>

  </section>


  <section class="section">

    <div class="section-title">
      <h2>المواد الدراسية</h2>
    </div>

    <div id="subjects">

      <div class="empty">
        جاري تحميل المواد...
      </div>

    </div>

  </section>

</main>


<footer>
  © 2026 MedStart
</footer>


<!-- AUTH MODAL -->

<div
  class="modal"
  id="authModal">

  <div class="modal-box">

    <h2 id="authTitle">
      تسجيل الدخول
    </h2>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <div class="modal-actions">

      <button
        class="primary"
        id="authSubmit">
        تسجيل الدخول
      </button>

      <button
        class="secondary"
        id="closeModal">
        إغلاق
      </button>

    </div>

    <div
      class="message"
      id="authMessage">
    </div>

  </div>

</div>


<script type="module">

  /* ==========================================
     FIREBASE IMPORTS
  ========================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc
  } from
  "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  /* ==========================================
     FIREBASE CONFIG
  ========================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAgpyK22xVCCyfrcdkwYwv8Y7brmpEsBDs",

    authDomain:
      "medstart-ee44d.firebaseapp.com",

    projectId:
      "medstart-ee44d",

    storageBucket:
      "medstart-ee44d.firebasestorage.app",

    messagingSenderId:
      "378114086129",

    appId:
      "1:378114086129:web:2ca927eb5d4a52fe83c550",

    measurementId:
      "G-XWXB59DX4Y"

  };


  /* ==========================================
     INITIALIZE FIREBASE
  ========================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* ==========================================
     ELEMENTS
  ========================================== */

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const guestButtons =
    document.getElementById("guestButtons");

  const userBox =
    document.getElementById("userBox");

  const userEmail =
    document.getElementById("userEmail");

  const authModal =
    document.getElementById("authModal");

  const closeModal =
    document.getElementById("closeModal");

  const authTitle =
    document.getElementById("authTitle");

  const authSubmit =
    document.getElementById("authSubmit");

  const authMessage =
    document.getElementById("authMessage");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");


  let authMode = "login";


  /* ==========================================
     MESSAGE
  ========================================== */

  function showMessage(
    text,
    type = "error"
  ) {

    authMessage.textContent = text;

    authMessage.className =
      "message show " + type;

  }


  function clearMessage() {

    authMessage.textContent = "";

    authMessage.className =
      "message";

  }


  /* ==========================================
     OPEN AUTH
  ========================================== */

  function openAuth(mode) {

    authMode = mode;

    clearMessage();

    email.value = "";
    password.value = "";

    authModal.classList.add("active");

    if (mode === "login") {

      authTitle.textContent =
        "تسجيل الدخول";

      authSubmit.textContent =
        "تسجيل الدخول";

    } else {

      authTitle.textContent =
        "إنشاء حساب";

      authSubmit.textContent =
        "إنشاء حساب";

    }

  }


  loginBtn.addEventListener(
    "click",
    () => openAuth("login")
  );


  registerBtn.addEventListener(
    "click",
    () => openAuth("register")
  );


  closeModal.addEventListener(
    "click",
    () => {

      authModal.classList.remove("active");

    }
  );


  authModal.addEventListener(
    "click",
    event => {

      if (event.target === authModal) {

        authModal.classList.remove("active");

      }

    }
  );


  /* ==========================================
     AUTH
  ========================================== */

  authSubmit.addEventListener(
    "click",
    async () => {

      const userEmail =
        email.value.trim();

      const userPassword =
        password.value;


      if (!userEmail) {

        showMessage(
          "اكتب البريد الإلكتروني."
        );

        return;

      }


      if (!userPassword) {

        showMessage(
          "اكتب كلمة المرور."
        );

        return;

      }


      if (userPassword.length < 6) {

        showMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;

      }


      authSubmit.disabled = true;


      try {

        if (authMode === "login") {

          await signInWithEmailAndPassword(
            auth,
            userEmail,
            userPassword
          );


          showMessage(
            "تم تسجيل الدخول بنجاح.",
            "success"
          );


          setTimeout(() => {

            authModal.classList.remove(
              "active"
            );

          }, 700);


        } else {


          const credential =
            await createUserWithEmailAndPassword(
              auth,
              userEmail,
              userPassword
            );


          const user =
            credential.user;


          /* إنشاء ملف الطالب في Firestore */

          await setDoc(
            doc(
              db,
              "users",
              user.uid
            ),
            {

              fullName:
                userEmail,

              email:
                userEmail,

              role:
                "student",

              walletBalance:
                0,

              createdAt:
                Date.now()

            }
          );


          showMessage(
            "تم إنشاء الحساب بنجاح.",
            "success"
          );


          setTimeout(() => {

            authModal.classList.remove(
              "active"
            );

          }, 700);

        }

      } catch (error) {

        console.error(
          "Firebase Auth Error:",
          error
        );


        let message =
          "حدث خطأ. حاول مرة أخرى.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message =
            "هذا البريد الإلكتروني مستخدم بالفعل.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "البريد الإلكتروني غير صحيح.";

        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          message =
            "كلمة المرور ضعيفة.";

        }

        else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "لا يوجد حساب بهذا البريد.";

        }

        showMessage(message);

      } finally {

        authSubmit.disabled = false;

      }

    }
  );


  /* ==========================================
     LOGOUT
  ========================================== */

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    }
  );


  /* ==========================================
     AUTH STATE
  ========================================== */

  onAuthStateChanged(
    auth,
    user => {

      if (user) {

        guestButtons.style.display =
          "none";

        userBox.style.display =
          "flex";

        userEmail.textContent =
          user.email || "حسابك";

      } else {

        guestButtons.style.display =
          "block";

        userBox.style.display =
          "none";

        userEmail.textContent =
          "";

      }

    }
  );


  /* ==========================================
     LOAD SUBJECTS
  ========================================== */

  async function loadSubjects() {

    const container =
      document.getElementById("subjects");


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "subjects"
          )
        );


      if (snapshot.empty) {

        container.innerHTML = `
          <div class="empty">
            لا توجد مواد مضافة حاليًا.
          </div>
        `;

        return;

      }


      container.innerHTML = "";


      snapshot.forEach(
        item => {

          const data =
            item.data();


          if (
            data.isActive === false
          ) {

            return;

          }


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "subject-card";


          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            data.name ||
            "مادة دراسية";


          const description =
            document.createElement(
              "p"
            );

          description.textContent =
            data.description ||
            "لا يوجد وصف للمادة.";


          card.appendChild(title);

          card.appendChild(
            description
          );


          container.appendChild(
            card
          );

        }
      );


      if (!container.children.length) {

        container.innerHTML = `
          <div class="empty">
            لا توجد مواد نشطة حاليًا.
          </div>
        `;

      }


    } catch (error) {

      console.error(
        "Firestore Error:",
        error
      );


      container.innerHTML = `
        <div class="empty">
          تعذر تحميل المواد حاليًا.
        </div>
      `;

    }

  }


  /* ==========================================
     START
  ========================================== */

  loadSubjects();

</script>

</body>
  </html>
