<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MedStart - الإدارة</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#172033
}
header{
background:#fff;
border-bottom:1px solid #e5e7eb;
padding:16px 20px
}
.header{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}
.logo{
font-size:24px;
font-weight:800;
color:#2563eb
}
.container{
max-width:1200px;
margin:auto;
padding:25px 20px
}
.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 20px rgba(0,0,0,.05)
}
h2{margin-top:0}
input,textarea,select{
width:100%;
padding:12px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:9px;
font-size:15px
}
textarea{min-height:100px;resize:vertical}
button{
border:0;
border-radius:9px;
padding:11px 16px;
cursor:pointer;
font-weight:700
}
.primary{background:#2563eb;color:#fff}
.danger{background:#dc2626;color:#fff}
.secondary{background:#eef2ff;color:#2563eb}
.hidden{display:none}
.message{
padding:12px;
border-radius:9px;
margin:10px 0;
background:#eef2ff
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px
}
.item{
border:1px solid #e5e7eb;
border-radius:12px;
padding:15px
}
.item h3{margin-top:0}
.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px
}
table{
width:100%;
border-collapse:collapse
}
th,td{
padding:10px;
border-bottom:1px solid #e5e7eb;
text-align:right
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">MedStart Admin</div>
<button id="logoutBtn" class="secondary">تسجيل الخروج</button>
</div>
</header>

<div class="container">

<div id="loading" class="card">
جاري التحقق من صلاحيات الإدارة...
</div>

<div id="adminPanel" class="hidden">

<div id="message"></div>

<!-- ================= SUBJECT ================= -->

<div class="card">

<h2>إضافة مادة</h2>

<input id="subjectName" placeholder="اسم المادة">

<textarea id="subjectDescription"
placeholder="وصف المادة"></textarea>

<input id="subjectImage"
placeholder="رابط صورة المادة">

<input id="subjectOrder"
type="number"
placeholder="ترتيب المادة">

<button class="primary" id="addSubject">
إضافة المادة
</button>

</div>

<!-- ================= SUBJECTS ================= -->

<div class="card">

<h2>المواد الحالية</h2>

<div id="subjectsList" class="grid">
</div>

</div>

<!-- ================= UNIT ================= -->

<div class="card">

<h2>إضافة وحدة</h2>

<select id="unitSubject">
<option value="">اختر المادة</option>
</select>

<input id="unitTitle"
placeholder="اسم الوحدة">

<textarea id="unitDescription"
placeholder="وصف الوحدة"></textarea>

<input id="unitImage"
placeholder="رابط صورة الوحدة">

<input id="unitPrice"
type="number"
step="0.01"
placeholder="سعر الوحدة">

<input id="unitOrder"
type="number"
placeholder="ترتيب الوحدة">

<button class="primary" id="addUnit">
إضافة الوحدة
</button>

</div>

<!-- ================= UNITS ================= -->

<div class="card">

<h2>الوحدات</h2>

<div id="unitsList" class="grid">
</div>

</div>

<!-- ================= LESSON ================= -->

<div class="card">

<h2>إضافة درس</h2>

<select id="lessonUnit">
<option value="">اختر الوحدة</option>
</select>

<input id="lessonTitle"
placeholder="عنوان الدرس">

<textarea id="lessonDescription"
placeholder="وصف الدرس"></textarea>

<input id="lessonOrder"
type="number"
placeholder="ترتيب الدرس">

<h3>محتوى الدرس</h3>

<input id="videoUrl"
placeholder="رابط الفيديو">

<input id="pdfUrl"
placeholder="رابط PDF">

<input id="solutionPdfUrl"
placeholder="رابط PDF الحل">

<input id="quizUrl"
placeholder="رابط الاختبار">

<textarea id="lessonNotes"
placeholder="ملاحظات الدرس"></textarea>

<button class="primary" id="addLesson">
إضافة الدرس
</button>

</div>

<!-- ================= LESSONS ================= -->

<div class="card">

<h2>الدروس</h2>

<div id="lessonsList" class="grid">
</div>

</div>

<!-- ================= STUDENTS ================= -->

<div class="card">

<h2>الطلاب</h2>

<div id="studentsList">
جاري التحميل...
</div>

</div>

</div>
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
addDoc,
deleteDoc,
query,
where,
orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyAgpyK22xVCCyfrcdkwYwv8Y7brmpEsBDs",

authDomain:"medstart-ee44d.firebaseapp.com",

projectId:"medstart-ee44d",

storageBucket:"medstart-ee44d.firebasestorage.app",

messagingSenderId:"378114086129",

appId:"1:378114086129:web:2ca927eb5d4a52fe83c550",

measurementId:"G-XWXB59DX4Y"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


const loading=document.getElementById("loading");
const adminPanel=document.getElementById("adminPanel");
const message=document.getElementById("message");


function showMessage(text){

message.textContent=text;
message.className="message";

setTimeout(()=>{
message.textContent="";
},4000);

}


async function checkAdmin(user){

if(!user){

location.href="index.html";
return;
}

const snap=await getDoc(
doc(db,"users",user.uid)
);

if(!snap.exists() || snap.data().role!=="admin"){

loading.innerHTML=
"ليس لديك صلاحية الدخول إلى لوحة الإدارة.";

return;
}

loading.classList.add("hidden");
adminPanel.classList.remove("hidden");

loadSubjects();
loadUnits();
loadLessons();
loadStudents();

}


onAuthStateChanged(auth,user=>{

checkAdmin(user).catch(error=>{

console.error(error);

loading.textContent=
"حدث خطأ أثناء التحقق من الحساب.";

});

});


/* ================= SUBJECTS ================= */

async function loadSubjects(){

const list=document.getElementById("subjectsList");

const select=document.getElementById("unitSubject");

list.innerHTML="";
select.innerHTML=
'<option value="">اختر المادة</option>';

const snap=await getDocs(
query(
collection(db,"subjects"),
orderBy("sortOrder")
)
);

snap.forEach(item=>{

const data=item.data();

const card=document.createElement("div");

card.className="item";

card.innerHTML=`

<h3>${escapeHtml(data.name||"")}</h3>

<p>${escapeHtml(data.description||"")}</p>

<div class="actions">

<button
class="danger"
data-delete-subject="${item.id}">
حذف
</button>

</div>

`;

list.appendChild(card);


const option=document.createElement("option");

option.value=item.id;

option.textContent=data.name;

select.appendChild(option);

});

}


document.getElementById("addSubject")
.addEventListener("click",async()=>{

const name=
document.getElementById("subjectName").value.trim();

if(!name){

showMessage("اكتب اسم المادة");

return;
}

await addDoc(
collection(db,"subjects"),
{
name,
description:
document.getElementById("subjectDescription").value.trim(),

imageUrl:
document.getElementById("subjectImage").value.trim(),

sortOrder:
Number(document.getElementById("subjectOrder").value)||0,

isActive:true,

createdAt:Date.now()
}
);

showMessage("تمت إضافة المادة");

document.getElementById("subjectName").value="";
document.getElementById("subjectDescription").value="";
document.getElementById("subjectImage").value="";
document.getElementById("subjectOrder").value="";

loadSubjects();

});


/* ================= UNITS ================= */

async function loadUnits(){

const list=document.getElementById("unitsList");

const select=document.getElementById("lessonUnit");

list.innerHTML="";
select.innerHTML=
'<option value="">اختر الوحدة</option>';

const snap=await getDocs(
query(
collection(db,"units"),
orderBy("sortOrder")
)
);

snap.forEach(item=>{

const data=item.data();

const card=document.createElement("div");

card.className="item";

card.innerHTML=`

<h3>${escapeHtml(data.title||"")}</h3>

<p>${escapeHtml(data.description||"")}</p>

<p>
السعر:
${Number(data.price||0).toFixed(2)}
</p>

<div class="actions">

<button
class="danger"
data-delete-unit="${item.id}">
حذف
</button>

</div>

`;

list.appendChild(card);


const option=document.createElement("option");

option.value=item.id;

option.textContent=data.title;

select.appendChild(option);

});

}


document.getElementById("addUnit")
.addEventListener("click",async()=>{

const subjectId=
document.getElementById("unitSubject").value;

const title=
document.getElementById("unitTitle").value.trim();

if(!subjectId || !title){

showMessage("اختر المادة واكتب اسم الوحدة");

return;
}

await addDoc(
collection(db,"units"),
{

subjectId,

title,

description:
document.getElementById("unitDescription").value.trim(),

imageUrl:
document.getElementById("unitImage").value.trim(),

price:
Number(document.getElementById("unitPrice").value)||0,

sortOrder:
Number(document.getElementById("unitOrder").value)||0,

isActive:true,

createdAt:Date.now()

}
);

showMessage("تمت إضافة الوحدة");

document.getElementById("unitTitle").value="";
document.getElementById("unitDescription").value="";
document.getElementById("unitImage").value="";
document.getElementById("unitPrice").value="";
document.getElementById("unitOrder").value="";

loadUnits();

});


/* ================= LESSONS ================= */

async function loadLessons(){

const list=
document.getElementById("lessonsList");

list.innerHTML="";

const snap=await getDocs(
query(
collection(db,"lessons"),
orderBy("sortOrder")
)
);

snap.forEach(item=>{

const data=item.data();

const card=
document.createElement("div");

card.className="item";

card.innerHTML=`

<h3>${escapeHtml(data.title||"")}</h3>

<p>${escapeHtml(data.description||"")}</p>

<div class="actions">

<button
class="danger"
data-delete-lesson="${item.id}">
حذف
</button>

</div>

`;

list.appendChild(card);

});

}


/* ================= ADD LESSON ================= */

document.getElementById("addLesson")
.addEventListener("click",async()=>{

const unitId=
document.getElementById("lessonUnit").value;

const title=
document.getElementById("lessonTitle").value.trim();

if(!unitId || !title){

showMessage("اختر الوحدة واكتب عنوان الدرس");

return;
}


const lessonRef=
await addDoc(
collection(db,"lessons"),
{

unitId,

title,

description:
document.getElementById("lessonDescription").value.trim(),

sortOrder:
Number(document.getElementById("lessonOrder").value)||0,

isActive:true,

createdAt:Date.now()

}
);


await addDoc(
collection(db,"lessonContents"),
{

lessonId:lessonRef.id,

videoUrl:
document.getElementById("videoUrl").value.trim(),

pdfUrl:
document.getElementById("pdfUrl").value.trim(),

solutionPdfUrl:
document.getElementById("solutionPdfUrl").value.trim(),

quizUrl:
document.getElementById("quizUrl").value.trim(),

notes:
document.getElementById("lessonNotes").value.trim(),

videoAvailable:true,

pdfAvailable:true,

quizAvailable:true,

createdAt:Date.now()

}
);


showMessage("تمت إضافة الدرس ومحتواه");

document.getElementById("lessonTitle").value="";
document.getElementById("lessonDescription").value="";
document.getElementById("lessonOrder").value="";
document.getElementById("videoUrl").value="";
document.getElementById("pdfUrl").value="";
document.getElementById("solutionPdfUrl").value="";
document.getElementById("quizUrl").value="";
document.getElementById("lessonNotes").value="";

loadLessons();

});


/* ================= STUDENTS ================= */

async function loadStudents(){

const container=
document.getElementById("studentsList");

const snap=
await getDocs(
query(
collection(db,"users"),
where("role","==","student")
)
);

if(snap.empty){

container.innerHTML=
"<p>لا يوجد طلاب حاليًا.</p>";

return;
}

const table=document.createElement("table");

table.innerHTML=`

<thead>

<tr>

<th>الاسم</th>
<th>البريد</th>
<th>UID</th>

</tr>

</thead>

<tbody></tbody>

`;

const tbody=
table.querySelector("tbody");

snap.forEach(item=>{

const data=item.data();

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
${escapeHtml(data.fullName||"")}
</td>

<td>
${escapeHtml(data.email||"")}
</td>

<td>
${escapeHtml(item.id)}
</td>

`;

tbody.appendChild(tr);

});

container.innerHTML="";

container.appendChild(table);

}


/* ================= DELETE ================= */

document.addEventListener("click",async event=>{

const subjectId=
event.target.dataset.deleteSubject;

const unitId=
event.target.dataset.deleteUnit;

const lessonId=
event.target.dataset.deleteLesson;


if(subjectId){

if(!confirm("حذف المادة؟"))return;

await deleteDoc(
doc(db,"subjects",subjectId)
);

loadSubjects();

}


if(unitId){

if(!confirm("حذف الوحدة؟"))return;

await deleteDoc(
doc(db,"units",unitId)
);

loadUnits();

}


if(lessonId){

if(!confirm("حذف الدرس؟"))return;

await deleteDoc(
doc(db,"lessons",lessonId)
);

loadLessons();

}

});


/* ================= LOGOUT ================= */

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

location.href="index.html";

});


/* ================= SECURITY ================= */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
  </html>
